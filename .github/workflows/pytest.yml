# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Pytest

on:
  push:
    branches: [ main, fix/legacy-f2000-a1780-compat ]
  pull_request:
    branches: [ main, feature/old ]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # HA 2026.10 needs Python >=3.14.2. Its USB integration imports serialx,
        # which is installed with the relevant HA integration at runtime, but not
        # by the core pip package alone in this test environment.
        pip install "cryptography==50.0.1" "serialx" -r requirements_dev.txt
    - name: Test with pytest and coverage
      run: |
        pytest --cov=custom_components
    - name: Test with pytest
      run: |
        pytest
